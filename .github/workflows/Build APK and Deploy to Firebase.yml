name: CI/CD - Android Release

on:
  push:
    tags:
      - 'v*'  # Déclenche l'action sur les tags qui commencent par 'v' (ex : v1.0.0)

jobs:
  build:
    name: Build APK and Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      # Checkout du code
      - name: Checkout code
        uses: actions/checkout@v2

      # Configuration de JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'

      # Configuration de l'Android SDK
      - name: Set up Android SDK
        uses: actions/setup-android@v2
        with:
          sdk-version: '35'

      # Décryptage du keystore (si nécessaire)
      - name: Decrypt keystore (Optional)
        run: |
          echo "$KEYSTORE" | base64 --decode > my-release-key.jks
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}

      # Compilation de l'APK
      - name: Build APK
        run: ./gradlew assembleRelease

      # Déploiement sur Firebase App Distribution
      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          groups: testers  # Le nom du groupe de testeurs Firebase
          file: app/build/outputs/apk/release/app-release.apk  # Le chemin vers votre APK généré

      # Suppression du keystore (si nécessaire)
      - name: Clean up keystore (Optional)
        run: rm my-release-key.jks
