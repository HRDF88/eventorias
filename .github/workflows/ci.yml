name: Android CI with SonarCloud

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Recreate google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew


        
      - name: Disable AndroidTestCoverage task
        run: |
          echo "// Disable AndroidTestCoverage task" >> app/build.gradle.kts
          echo "tasks.matching { it.name == \"createDebugAndroidTestCoverageReport\" }.configureEach { enabled = false }" >> app/build.gradle.kts

      - name: Run unit tests and generate JaCoCo report
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Check if Jacoco XML file exists
        run: |
          if [ ! -f app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml ]; then
            echo "Jacoco XML file not found!"
            exit 1
          fi

      - name: List generated JaCoCo HTML report files
        run: ls -R app/build/reports/jacoco/testDebugUnitTest/html


      - name: Upload JaCoCo coverage report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/testDebugUnitTest/html

      - name: Upload JaCoCo XML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar --info \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=hrdf88 \
          -Dsonar.projectKey=HRDF88_eventorias \
          -Dsonar.login=$SONAR_TOKEN \
          -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
