name: Android Release - Firebase App Distribution

on:
  push:
    tags:
      - 'v*'  # Déclenche l'action sur les tags qui commencent par 'v' (ex : v1.0.0)

jobs:
  build:
    name: Build APK and Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'

      - name: Set up Android SDK
        uses: actions/setup-android@v2
        with:
          sdk-version: '35'

      - name: Decrypt keystore (Optional)
        run: |
          echo "$KEYSTORE" | base64 --decode > my-release-key.jks
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_AUTH_TOKEN }}
          groups: testers 
          file: app/build/outputs/apk/release/app-release.apk  

      - name: Clean up keystore (Optional)
        run: rm my-release-key.jks
