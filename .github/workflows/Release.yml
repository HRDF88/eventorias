name: CI/CD - Android Release

on:
  push:
    tags:
      - 'v*'  # Déclenche l'action sur les tags qui commencent par 'v' (ex : v1.0.0)

jobs:
  build:
    name: Build APK and Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      # Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configuration de JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

  # Décryptage du keystore
      - name: Decode release_key2.jks
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release_key2.jks
          echo "✅ Keystore has been decoded and saved to: $(pwd)/app/release_key2.jks"
          echo "📁 Contents of app/ directory:"
          ls -l app/
          echo "🔍 File details:"
          file app/release_key2.jks
          stat app/release_key2.jks
      

      # Donner les droits à gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      #Création du fichier google-services.json à partir du secret encodé en base64
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      # Compilation de l'APK avec signature
      - name: Build APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=release_key2.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # Déploiement sur Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}   # Firebase Application ID
          groups: testers                         # Firebase group defined for testers
          file: app/build/outputs/apk/release/app-release.apk  # Path to the generated APK
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}  # Firebase service account JSON key
        env:
          ACTIONS_STEP_DEBUG: true # Enable step debug output for troubleshooting


